quarkus.http.port=8086
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:mysql://db:3306/patient_journal_app?allowPublicKeyRetrieval=true&useSSL=false
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.dialect=org.hibernate.dialect.MySQLDialect
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.http.cors.headers=Content-Type, Authorization, X-Requested-With

# Require authentication for all endpoints
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=permit
quarkus.smallrye-jwt.auth.enabled=false


quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus".level=DEBUG
quarkus.log.level=DEBUG
