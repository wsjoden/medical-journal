spring.application.name=user-service
server.port=${PORT:8080}

# Database connection settings for local development
# DB in Deployment
# spring.datasource.url=jdbc:postgresql://medical-app-db-postgres:5432/medical-app?user=admin&password=admin
# DB in VM
spring.datasource.url=jdbc:postgresql://vm.cloud.cbh.kth.se:20253/medical_app
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Service URLs
user.service.url=https://medical-app-user-service.app.cloud.cbh.kth.se
medical.data.service.url=https://medical-app-med-data-service.app.cloud.cbh.kth.se
message.service.url=https://medical-app-message-service.app.cloud.cbh.kth.se
image.service.url=https://medical-app-image-service.app.cloud.cbh.kth.se
search.service.url=https://medical-app-search-service.app.cloud.cbh.kth.se
frontend.url=https://medical-app-frontend.app.cloud.cbh.kth.se

# Hibernate settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create    
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# OAuth2 Resource Server (Keycloak integration)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://wsjoden-kc.app.cloud.cbh.kth.se/realms/patient_app

# Debug logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG


