name: Frontend Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create prod.env file
        run: |
          echo "REACT_APP_KEYCLOAK_URL=https://wsjoden-keycloak-deployment.app.cloud.cbh.kth.se" > .env.production
          echo "REACT_APP_KEYCLOAK_REALM=patient_app" >> .env.production
          echo "REACT_APP_KEYCLOAK_CLIENT=frontend" >> .env.production
          cat .env.production
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: registry.cloud.cbh.kth.se
          username: ${{ secrets.DOCKER_USERNAME_FRONTEND }}
          password: ${{ secrets.DOCKER_PASSWORD_FRONTEND }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_TAG_FRONTEND }}
          build-args: |
            REACT_APP_KEYCLOAK_URL=https://wsjoden-keycloak-deployment.app.cloud.cbh.kth.se
            REACT_APP_KEYCLOAK_REALM=patient_app
            REACT_APP_KEYCLOAK_CLIENT=frontend
