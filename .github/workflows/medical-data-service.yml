name: medical-data-service
"on":
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                registry: registry.cloud.cbh.kth.se
                username: ${{ secrets.DOCKER_USERNAME_MEDICAL_DATA }}
                password: ${{ secrets.DOCKER_PASSWORD_MEDICAL_DATA }}
            - name: checkout
              uses: actions/checkout@v2
            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                context: ./backend/medical_data_service
                file: ./backend/medical_data_service/Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_TAG_MEDICAL_DATA }}
